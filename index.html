<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tấn Đại Bất Động Sản | Overlay dọc 1080x1920</title>
<style>
:root{--gold:#f9d894;--gold2:#a8762d;--cyan:#73d9ec;--dark:#0d1722}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Segoe UI",Arial,sans-serif;color:white}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:transparent;isolation:isolate}
.frame{position:absolute;left:28px;width:1024px;border:3px solid rgba(246,204,127,.86);border-radius:26px;box-shadow:0 0 0 2px rgba(24,41,55,.6) inset,0 0 15px rgba(242,184,93,.27),0 0 24px rgba(93,213,239,.14);pointer-events:none}
.frame:before{content:"";position:absolute;inset:8px;border:1px solid rgba(109,221,236,.48);border-radius:18px}
#camera{top:64px;height:784px}#map{top:991px;height:880px}
.corner{position:absolute;width:74px;height:74px;border-color:var(--cyan);border-style:solid;filter:drop-shadow(0 0 9px rgba(86,228,246,.5))}
.tl{top:-4px;left:-4px;border-width:6px 0 0 6px;border-radius:24px 0 0 0}.tr{top:-4px;right:-4px;border-width:6px 6px 0 0;border-radius:0 24px 0 0}.bl{bottom:-4px;left:-4px;border-width:0 0 6px 6px;border-radius:0 0 0 24px}.br{bottom:-4px;right:-4px;border-width:0 6px 6px 0;border-radius:0 0 24px 0}
#topbar{position:absolute;top:10px;left:110px;right:110px;height:47px;border-radius:17px;background:linear-gradient(90deg,rgba(6,17,27,.95),rgba(24,44,55,.9),rgba(6,17,27,.95));border:1px solid rgba(246,211,153,.65);box-shadow:0 6px 24px rgba(0,0,0,.23);display:flex;align-items:center;justify-content:center;gap:18px}
#topbar .dot{width:10px;height:10px;border-radius:50%;background:#ffc875;box-shadow:0 0 12px #ffc875;animation:pulse 3s infinite}
#topbar strong{font-size:24px;letter-spacing:2px;color:#ffe3a7;text-shadow:0 0 15px rgba(245,191,92,.4)}
.label{position:absolute;left:58px;padding:11px 20px;background:linear-gradient(90deg,rgba(5,18,28,.94),rgba(17,46,59,.87));border:1px solid rgba(109,221,236,.65);border-radius:12px;font-size:20px;font-weight:700;letter-spacing:2px;box-shadow:0 0 18px rgba(57,200,225,.2)}
#camera-label{top:80px}#map-label{top:1007px}
#live{position:absolute;right:58px;top:80px;padding:11px 20px;background:rgba(151,28,39,.92);border:1px solid rgba(255,174,174,.8);border-radius:12px;font-size:20px;font-weight:800;letter-spacing:2px}
#live:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#fff;margin-right:10px;animation:pulse 1.9s infinite}
#center{position:absolute;left:18px;right:18px;top:856px;height:127px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:linear-gradient(90deg,rgba(7,19,30,.95),rgba(24,49,60,.94) 50%,rgba(7,19,30,.95));border:2px solid rgba(244,195,114,.75);border-radius:24px;box-shadow:0 0 26px rgba(244,195,114,.16),0 8px 20px rgba(0,0,0,.25)}
#center:before,#center:after{content:"";position:absolute;top:50%;width:48px;height:2px;background:linear-gradient(90deg,transparent,#f5d296)}
#center:before{left:24px}#center:after{right:24px;transform:rotate(180deg)}
#center .brand{font-weight:900;font-size:32px;letter-spacing:.6px;line-height:1.05;color:#ffe0a1;text-shadow:0 0 18px rgba(249,208,133,.24)}
#center .contact{font-weight:700;font-size:30px;letter-spacing:2px;color:#b9f5ff}
#center .separator{display:inline-block;color:#f2cb83;padding:0 12px}
#bottom{position:absolute;left:28px;right:28px;bottom:8px;height:34px;border:1px solid rgba(245,205,132,.65);border-radius:15px;background:linear-gradient(90deg,rgba(5,20,32,.94),rgba(23,48,61,.91),rgba(5,20,32,.94));display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 0 18px rgba(112,217,236,.13);font-size:16px;font-weight:700;letter-spacing:1px;color:#fff1c7}
#bottom .spark{color:#85e6ef;animation:pulse 3s infinite}
#snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.flake{position:absolute;top:-30px;border-radius:50%;background:rgba(255,255,255,.62);box-shadow:0 0 6px rgba(255,255,255,.2);animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-20px,0)}to{transform:translate3d(var(--drift),1980px,0)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
 <div id="topbar"><span class="dot"></span><strong>TẤN ĐẠI • PHÁP LÝ BẤT ĐỘNG SẢN</strong><span class="dot"></span></div>
 <div id="camera" class="frame" aria-label="Khung camera trên, vùng bên trong trong suốt"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
 <div id="camera-label" class="label">CAMERA TRỰC TIẾP</div><div id="live">LIVE</div>
 <div id="center"><div class="brand">CHECK QUY HOẠCH MIỄN PHÍ 63 TỈNH THÀNH</div><div class="contact">DÉP LÀO : @366.747.129</div></div>
 <div id="map" class="frame" aria-label="Khung bản đồ dưới, vùng bên trong trong suốt"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
 <div id="map-label" class="label">CHECK QUY HOẠCH • PHÁP LÝ</div>
 <div id="bottom"><span class="spark">✦</span> KIỂM TRA QUY HOẠCH <span class="spark">✦</span> TƯ VẤN NHÀ ĐẤT <span class="spark">✦</span></div>
 <div id="snow"></div>
</div>
<script>
(function(){
 const stage=document.getElementById('stage');
 function fit(){stage.style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
 window.addEventListener('resize',fit);fit();
 // Hạt tuyết thưa, nhỏ, rơi chậm; không ảnh hưởng thao tác.
 const snow=document.getElementById('snow');
 for(let i=0;i<18;i++){
   const s=document.createElement('i');s.className='flake';
   const size=1.2+Math.random()*2.2;
   s.style.width=size+'px';s.style.height=size+'px';
   s.style.left=(Math.random()*1080)+'px';
   s.style.opacity=(.16+Math.random()*.28).toFixed(2);
   s.style.setProperty('--drift',((Math.random()-.5)*100).toFixed(0)+'px');
   s.style.animationDuration=(22+Math.random()*20).toFixed(1)+'s';
   s.style.animationDelay=(-Math.random()*33).toFixed(1)+'s';
   snow.appendChild(s);
 }
})();
</script>
</body></html>
